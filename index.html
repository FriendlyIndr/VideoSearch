<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Video search</h1>
        <p class="subtitle">Semantic search across your indexed YouTube videos</p>
    
        <div class="tab-row">
            <button class="tab active" onclick="switchTab('search', this)">Search</button>
            <button class="tab" onclick="switchTab('library', this)">Indexed videos</button>
        </div>

        <!-- Search section -->
        <div id="search-section">
            <div class="search-row">
                <input type="text" id="query" placeholder="What are you looking for?" autofocus />
                <div class="top-k-wrap">
                    <label for="topk">Top</label>
                    <select id="topk">
                        <option value="3">3</option>
                        <option value="5" selected>5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                </div>
                <button id="searchBtn" onclick="doSearch()">Search</button>
            </div>
        
            <div class="status" id="status"></div>
            <div class="results" id="results"></div>
        </div>

        <!-- Library section -->
         <div id="library-section" class="section-hidden">
            <div class="add-row">
                <input type="text" id="add-url" placeholder="https://www.youtube.com/watch?v=..."/>
                <button id="addBtn" onclick="doAdd()">Add video</button>
            </div>

            <div class="status" id="add-status"></div>
            <div class="status" id="lib-status"></div>
            <div class="lib-card" id="lib-list"></div>
         </div>
    </div>
    
    <script>
        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            const isSearch = tab === "search";
            document.getElementById('search-section').classList.toggle('section-hidden', !isSearch);
            document.getElementById('library-section').classList.toggle('section-hidden', isSearch);
            if (!isSearch) loadLibrary();
        }

        async function doAdd() {
            const url = document.getElementById('add-url').value.trim();
            if (!url) return;

            const btn = document.getElementById('addBtn');
            const statusEl = document.getElementById('add-status');
            btn.disabled = true;
            statusEl.className = 'status';
            statusEl.innerHTML = `<span class="spinner"></span>Indexing`;

            try {
                const res = await fetch('/ingest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `Server error: ${res.status}`);
                }
                statusEl.style.color = '#0f6e56';
                statusEl.textContent = 'Video added and indexed successfully.';
                document.getElementById('add-url').value = '';
                loadLibrary();
            } catch (err) {
                statusEl.className = 'status error';
                statusEl.textContent = err.message;
            } finally {
                btn.disabled = false;
            }
        }

        async function loadLibrary() {
            const statusEl = document.getElementById('lib-status');
            const listEl = document.getElementById('lib-list');
            statusEl.innerHTML = `<span class="spinner"></span>Loading…`;
            listEl.innerHTML = '';

            try {
                const res = await fetch('/videos');
                if (!res.ok) throw new Error(`Server error: ${res.status}`);

                const videos = await res.json();
                statusEl.textContent = `${videos.length} indexed video${videos.length !== 1 ? 's' : ''}`;
                if (!videos.length) {
                    listEl.innerHTML = `<p class="empty">No videos indexed yet.</p>`;
                    return;
                }

                listEl.innerHTML = videos.map((v, i) => `
                    <div class="video-container">
                        <div class="video-row">
                            <span class="video-num">${i + 1}</span>
                            <div class="video-info">
                                <div class="video-title">${escapeHtml(v.title || 'Untitled')}</div>
                                <div class="video-id-label">${v.video_id}</div>
                            </div>
                            
                            <a class="video-ext-link"
                                href="https://www.youtube.com/watch?v=${v.video_id}"
                                target="_blank" rel="noopener">Open &#8599;</a>
                        </div>

                        <button 
                            class="expand-btn" 
                            id='chev-${v.video_id}' 
                            onclick="toggleExpand('${v.video_id}')"
                        >
                            View explanations ${
                                v.explanations?.length ? `(${v.explanations.length})` : ''
                            }
                        </button>

                        <div class="expand-section" id="expand-${v.video_id}">
                            <textarea
                                id="exp-${v.video_id}"
                                placeholder="Add your explanation..."
                                class="exp-box"
                            ></textarea>

                            <button 
                                class="add-exp-btn"
                                onclick="addExplanation('${v.video_id}')"
                            >
                                Add Explanation
                            </button>

                            <div class="explanations">
                                ${
                                    (v.explanations || []).length
                                    ? v.explanations.map(exp => `
                                        <div class="exp-item">${escapeHtml(exp)}</div>
                                    `).join()
                                    : `<div>No explanations</div>`
                                }
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                statusEl.className = 'status error';
                statusEl.textContent = err.message;
            }
        }

        function toggleExpand(videoId) {
            const el = document.getElementById(`expand-${videoId}`);
            el.classList.toggle('show');
        }

        async function addExplanation(videoId) {
            const textarea = document.getElementById(`exp-${videoId}`);
            const text = textarea.value.trim();

            if (!text) return alert("Please enter an explanation")

            try {
                const res = await fetch('/add_explanation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_id: videoId,
                        text: text,
                    })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || "Error");

                textarea.value = "";

                loadLibrary();
            } catch (err) {
                alert(err.message);
            }
        }

        const queryInput = document.getElementById("query");
        const statusEl = document.getElementById("status");
        const resultsEl = document.getElementById("results");
        const searchBtn = document.getElementById("searchBtn");
    
        queryInput.addEventListener("keydown", e => {
            if (e.key === "Enter") doSearch();
        });
    
        async function doSearch() {
            const q = queryInput.value.trim();
            if (!q) return;
        
            const topk = document.getElementById("topk").value;
            searchBtn.disabled = true;
            statusEl.className = "status";
            statusEl.innerHTML = `<span class="spinner"></span>Searching…`;
            resultsEl.innerHTML = "";
        
            try {
                const res = await fetch(`/search?q=${encodeURIComponent(q)}&top_k=${topk}`);
                if (!res.ok) throw new Error(`Server error: ${res.status}`);
                const data = await res.json();
        
                const { results } = data;
                statusEl.textContent = results.length
                ? `${results.length} result${results.length !== 1 ? "s" : ""} for "${q}"`
                : "";
        
                if (!results.length) {
                resultsEl.innerHTML = `<p class="empty">No results found.</p>`;
                return;
                }
        
                resultsEl.innerHTML = results.map((r, i) => `
                <div class="card">
                    <div class="card-header">
                    <a class="video-link"
                        href="https://www.youtube.com/watch?v=${r.video_id}"
                        target="_blank"
                        rel="noopener">
                        youtube.com/watch?v=${r.video_id}
                    </a>
                    <span class="score-badge">${(r.score * 100).toFixed(1)}% match</span>
                    </div>
                    <p class="chunk-text">${escapeHtml(r.text)}</p>
                </div>
                `).join("");
        
            } catch (err) {
                statusEl.className = "status error";
                statusEl.textContent = err.message;
            } finally {
                searchBtn.disabled = false;
            }
        }
    
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
